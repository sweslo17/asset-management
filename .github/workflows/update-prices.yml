# =============================================================================
# 價格/匯率更新的備援排程 + 過期告警
#
# 主要排程是 Cloudflare Worker Cron（worker/wrangler.toml [triggers]），但它曾無聲停擺
# （2026-09-17 起完全不觸發）。這裡在 Worker cron 之後 30 分鐘再打一次
# POST /api/backfill?mode=recent（覆寫近幾天，重複執行無副作用），並檢查回應：
#   - 有來源抓取失敗（errors 非空）或資料過期（stale）→ job 失敗 → GitHub 寄通知信。
#
# 需要：
#   - repo variable API_BASE_URL（與前端部署共用）
#   - repo secret  CRON_TOKEN（與 Worker secret CRON_TOKEN 同值）
# 注意：公開 repo 若 60 天沒有任何活動，GitHub 會自動停用排程 workflow，需到 Actions 頁手動重新啟用。
# =============================================================================
name: Update Prices (fallback)

on:
  schedule:
    # GitHub 用標準 cron：1-5 = 週一~週五（與 Cloudflare 的 1=週日不同）
    - cron: '30 6 * * 1-5'    # 台股收盤後
    - cron: '30 22 * * 1-5'   # 美股收盤後
  workflow_dispatch:
    inputs:
      mode:
        description: 'backfill mode'
        type: choice
        options: [recent, fill, rebuild]
        default: recent

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger backfill and check freshness
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          MODE: ${{ inputs.mode || 'recent' }}
        run: |
          set -euo pipefail
          url="${API_BASE_URL%/}/api/backfill?mode=${MODE}"
          resp=$(curl -sS --fail-with-body --retry 2 --retry-delay 10 -X POST \
            -H "X-Cron-Token: ${CRON_TOKEN}" "$url")
          echo "$resp" | jq .
          if ! echo "$resp" | jq -e '(.errors | length) == 0 and (.stale | not)' > /dev/null; then
            echo "::error::價格更新不完整或資料過期：$(echo "$resp" | jq -c '{errors, prices_as_of, rates_as_of, stale}')"
            exit 1
          fi
